name: SID One-Shot — Close unwanted UNH short (2026-07-01)

# ⚠️  ONE-OFF workflow — closes the single UNH bullish-asset short that auto-fired
# at $416.52 on 2026-06-30, far below its 439-440 supply zone (the v2.2.4 short
# approval gate now prevents this class of auto-short). DELETE THIS FILE after it
# has fired successfully.
#
# MANUAL-TRIGGER ONLY (no cron) — Alan (or the orchestrator on Alan's approval)
# runs it deliberately during US market hours. There is NO schedule, so it can
# never fire itself; the year-guard is belt-and-braces only.
#
# The close logic lives in SID/manual-close.js: it cancels the broker stop,
# submits a market BUY-to-cover for the 2 UNH shares (paper), then reconciles
# bot state (open→closed ledgers, trades-sid.csv, sid-account.json, sid-log.json)
# and Telegram-confirms. State changes are committed back to main after the run.
#
# Fire it with:
#   gh workflow run sid-oneshot-close-unh-2026-07-01.yml
#
# It targets the position by id (d9bca959-…) with a UNH symbol cross-check, so it
# refuses to touch anything else. If UNH is no longer open (e.g. the stop already
# filled), manual-close.js aborts safely and NO state is changed.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  close-unh:
    runs-on: ubuntu-latest
    steps:
      - name: Year guard — abort if not 2026
        run: |
          year=$(date -u +%Y)
          if [ "$year" != "2026" ]; then
            echo "::error::Fired in year $year, but this is a 2026-07-01 one-shot. Aborting safely."
            exit 1
          fi
          echo "✓ Year guard passed: $(date -u)"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - name: Close the unwanted UNH short
        working-directory: SID
        env:
          # ── Alpaca credentials (reuse existing secrets) ────────────────────
          ALPACA_KEY_ID:      ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY:  ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL:    ${{ secrets.ALPACA_BASE_URL }}
          SID_TRADING_MODE:   ${{ secrets.SID_TRADING_MODE }}
          SID_LIVE_CONFIRMED: ${{ secrets.SID_LIVE_CONFIRMED }}

          # ── Telegram (optional) ────────────────────────────────────────────
          TELEGRAM_BOT_TOKEN:      ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:        ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ALERTS_ENABLED: ${{ secrets.TELEGRAM_ALERTS_ENABLED }}

          # ── Close target (hardcoded to the unwanted UNH short) ─────────────
          CLOSE_POS_ID:        d9bca959-f4e3-4fa0-bcf0-bfca2cb8c272
          CLOSE_SYMBOL:        UNH
          CLOSE_STOP_ORDER_ID: cf53c7ad-9dfb-4048-bc9e-170ead3ae64d
          CLOSE_REASON:        "manual close — unwanted bullish-asset short below supply zone"
        run: node manual-close.js

      - name: Commit reconciled state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add SID/open-positions-sid.json SID/closed-positions-sid.json || true
          git add SID/trades-sid.csv SID/sid-account.json SID/sid-log.json    || true
          git diff --staged --quiet || git commit -m "SID manual close: UNH short $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase --autostash origin main
          git push
