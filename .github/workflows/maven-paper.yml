name: Maven Paper Bot

# Maven is a 4h strategy; paper fills are computed from CLOSED candles, so a run
# being a few minutes late never corrupts a trade. We check every 30 min for a
# timely dashboard + Telegram. Runs in the cloud — PC-independent.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: maven-paper
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # no pip cache: the engine is pure Python stdlib (no requirements.txt)

      - name: Run Maven paper bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python maven/bot-maven.py

      - name: Commit dashboard state
        run: |
          git config user.name  "maven-bot"
          git config user.email "maven-bot@users.noreply.github.com"
          git add docs/maven/state.json
          if git diff --staged --quiet; then
            echo "No state change this run."
          else
            git commit -m "Maven paper run $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          fi
