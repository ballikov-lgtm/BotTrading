name: SID Swing Bot

on:
  workflow_dispatch: # Manual trigger for testing

  schedule:
    # ── WEEKDAYS ONLY — REDUNDANT market-hours runs (14:35 / 16:35 / 18:35 UTC) ──
    # WHY 3 runs, not 1: GitHub Actions scheduled crons are best-effort and can be
    # DELAYED by hours under load. Real delays observed 2026-08 on the single 14:35
    # cron: it landed 23:51 (Aug 27), 23:37 (Aug 28) and 20:15 (Aug 31) UTC — all
    # AFTER the 20:00 UTC US market close. On a closed-market run the executor
    # refuses every order ("Market closed — refusing to submit ..."), so TP1/TP2
    # exits AND entries are silently skipped and a ripe TP1 (e.g. the PYPL short,
    # RSI well under 50) never banks. Three staggered runs across the session mean a
    # multi-hour delay on any one still leaves at least one execution inside US
    # regular hours (14:30–21:00 UTC). The bot is idempotent across same-day runs
    # (tp1_hit / tp2Hit-once guards, open-symbol skip + per-calendar-day entry cap
    # via countTodayTrades, deterministic de-duped approval queue), so extra runs
    # never double-open, double-bank, or double-alert. The first run that lands
    # in-hours does the work; later ones are cheap no-ops. SID is still a
    # daily-chart swing strategy — this is redundancy, not higher cadence.
    - cron: '35 14 * * 1-5'   # 14:35 UTC (09:35 ET) — 5 min after open
    - cron: '35 16 * * 1-5'   # 16:35 UTC (12:35 ET) — mid-session backup
    - cron: '35 18 * * 1-5'   # 18:35 UTC (14:35 ET) — late-session backup

permissions:
  contents: write

jobs:
  sid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - name: Run SID bot
        working-directory: SID
        env:
          # ── SID strategy config ──────────────────────────────────────────
          SID_ACCOUNT_USD:     ${{ secrets.SID_ACCOUNT_USD }}
          SID_RISK_PCT:        ${{ secrets.SID_RISK_PCT }}
          SID_MAX_POS_PCT:     ${{ secrets.SID_MAX_POS_PCT }}
          SID_MAX_POSITIONS:   ${{ secrets.SID_MAX_POSITIONS }}
          SID_MAX_PER_DAY:     ${{ secrets.SID_MAX_PER_DAY }}
          SID_EARNINGS_WINDOW: ${{ secrets.SID_EARNINGS_WINDOW }}
          SID_PAPER:           ${{ secrets.SID_PAPER }}
          # ── PDT-safe execution mode (default FALSE = standard "PDT version") ──
          # SID_PDT_SAFE=true → NO broker orders (no GTC stop, no resting intraday
          # short-TP1 limit). Positions are managed only by the daily-poll, so no
          # exit can fire the same day as entry → cannot trigger the Pattern Day
          # Trader rule. Recommended for accounts under $25,000. Leave unset/false
          # for the standard PDT version (real broker stops, best fills, but the
          # account must stay $25,000+ at all times). See SID-DEPLOY-PROMPT Step 8.
          SID_PDT_SAFE:        ${{ secrets.SID_PDT_SAFE }}

          # ── Alpaca execution (see SID-ALPACA-SETUP.md for setup) ─────────
          # SID_TRADING_MODE controls what happens with each signal:
          #   dry_run (default if secret unset) — no Alpaca calls, log only
          #   paper                              — Alpaca paper account
          #   live                               — Alpaca live account
          #                                        (also requires SID_LIVE_CONFIRMED
          #                                         = YES_I_REALLY_MEAN_IT)
          # If ALPACA_KEY_ID / ALPACA_SECRET_KEY are unset, the executor
          # automatically falls back to dry_run regardless of mode.
          SID_TRADING_MODE:    ${{ secrets.SID_TRADING_MODE }}
          SID_LIVE_CONFIRMED:  ${{ secrets.SID_LIVE_CONFIRMED }}
          ALPACA_KEY_ID:       ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY:   ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL:     ${{ secrets.ALPACA_BASE_URL }}

          # ── Telegram alerts (see SID-TELEGRAM-SETUP.md) ──────────────────
          # All three are optional. If BOT_TOKEN or CHAT_ID is missing, the
          # bot silently skips alerts and trades normally.
          # Set TELEGRAM_ALERTS_ENABLED=false to disable temporarily without
          # removing the secrets.
          TELEGRAM_BOT_TOKEN:       ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:         ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ALERTS_ENABLED:  ${{ secrets.TELEGRAM_ALERTS_ENABLED }}
        run: node bot-sid.js

      - name: Save trade logs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add SID/trades-sid.csv SID/sid-log.json          || true
          git add SID/open-positions-sid.json                    || true
          git add SID/closed-positions-sid.json                  || true
          git add SID/sid-account.json                           || true
          git diff --staged --quiet || git commit -m "SID run $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase --autostash origin main
          git push
